# Apache Guacamole: guacd + web + MariaDB (см. https://guacamole.apache.org/doc/gug/guacamole-docker.html )
# Схема БД (те же SQL-скрипты, что и для MySQL): https://guacamole.apache.org/doc/gug/mysql-auth.html

services:
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped

  # Одноразовое копирование SQL из образа guacamole в volume для mariadb/docker-entrypoint-initdb.d
  guacamole-schema:
    image: guacamole/guacamole:1.6.0
    user: "0:0" # named volume принадлежит root; без этого cp из-под пользователя образа даёт Permission denied
    restart: "no"
    volumes:
      - guacamole-initdb:/schema
      - ./config/mariadb-init:/extra-init:ro
    entrypoint:
      - /bin/sh
      - -c
      - cp -a /opt/guacamole/extensions/guacamole-auth-jdbc/mysql/schema/. /schema/ && find /extra-init -maxdepth 1 -name '*.sql' -type f -exec cp -t /schema/ {} +

  mariadb:
    image: mariadb:11.6
    restart: unless-stopped
    depends_on:
      guacamole-schema:
        condition: service_completed_successfully
    environment:
      # Замените в production через .env
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme_root}
      MARIADB_DATABASE: guacamole_db
      MARIADB_USER: guacamole_user
      MARIADB_PASSWORD: ${GUAC_DB_PASSWORD:-changeme_guac}
    volumes:
      - mariadb-data:/var/lib/mysql
      - guacamole-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      guacd:
        condition: service_started
    # Шаблон: user-mapping.xml, translations, и JAR расширений в config/extensions/
    # (брендинг окна входа: см. branding/ + scripts/build-branding-jar.sh, документация guacamole-ext)
    environment:
      GUACAMOLE_HOME: /opt/guacamole-config
      WEBAPP_CONTEXT: ROOT
      GUACD_HOSTNAME: guacd
      MYSQL_HOSTNAME: mariadb
      # В образе есть MySQL Connector/J; MariaDB Connector/J при MYSQL_DRIVER=mariadb в образе нет — падает UnpooledDataSource
      MYSQL_DRIVER: mysql
      MYSQL_DATABASE: guacamole_db
      MYSQL_USERNAME: guacamole_user
      MYSQL_PASSWORD: ${GUAC_DB_PASSWORD:-changeme_guac}
    volumes:
      - ./config:/opt/guacamole-config:ro
    ports:
      - "8080:8080"

  # Веб-UI для MariaDB: http://127.0.0.1:8081/ (образ https://hub.docker.com/_/adminer )
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: lucas-sandery
      ADMINER_DEFAULT_SERVER: mariadb
    ports:
      - "8081:8080"

volumes:
  mariadb-data:
  guacamole-initdb:
